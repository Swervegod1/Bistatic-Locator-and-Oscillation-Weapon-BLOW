[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blow-observation-workbench"
version = "0.1.0"
description = "Offline evidence and evaluation workbench for authorized, non-identifying observation records."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "B.L.O.W. contributors" }]

[project.scripts]
blow-evidence = "blow_observation.cli:main"

[tool.setuptools.packages.find]
include = ["blow_observation*"]
