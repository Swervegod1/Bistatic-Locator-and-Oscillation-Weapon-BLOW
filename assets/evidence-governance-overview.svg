<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">B.L.O.W. Evidence Studio evidence-governance overview</title>
  <desc id="description">A safe offline workflow from authorized redacted records to human-reviewed evidence cards and controlled retention.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071827"/>
      <stop offset="100%" stop-color="#0d2e4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#2ad5c8"/>
      <stop offset="100%" stop-color="#77b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#00111f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1440" height="810" fill="url(#background)"/>
  <path d="M0 640 C330 540 480 770 800 660 C1050 575 1210 620 1440 520 L1440 810 L0 810 Z" fill="#062038" opacity="0.8"/>
  <circle cx="1310" cy="110" r="180" fill="#20d5c8" opacity="0.06"/>
  <circle cx="115" cy="710" r="220" fill="#77b8ff" opacity="0.05"/>

  <text x="110" y="115" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">B.L.O.W. Evidence Studio</text>
  <text x="110" y="166" fill="#b8d2e7" font-family="Arial, Helvetica, sans-serif" font-size="25">Offline evidence integrity for transparent, human-governed AI evaluation</text>

  <rect x="110" y="215" width="1220" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="110" y="270" fill="#8ee8df" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="2">SAFE WORKFLOW</text>

  <g filter="url(#shadow)">
    <rect x="110" y="330" width="255" height="245" rx="22" fill="#0b3658" stroke="#397596" stroke-width="2"/>
    <rect x="405" y="330" width="255" height="245" rx="22" fill="#0b3658" stroke="#397596" stroke-width="2"/>
    <rect x="700" y="330" width="255" height="245" rx="22" fill="#0b3658" stroke="#397596" stroke-width="2"/>
    <rect x="995" y="330" width="335" height="245" rx="22" fill="#0b3658" stroke="#397596" stroke-width="2"/>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M365 452 H395"/>
    <path d="M660 452 H690"/>
    <path d="M955 452 H985"/>
  </g>
  <g fill="#77b8ff">
    <path d="M397 452 l-13 -9 v18 z"/>
    <path d="M692 452 l-13 -9 v18 z"/>
    <path d="M987 452 l-13 -9 v18 z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="155" cy="377" r="23" fill="#2ad5c8"/>
    <text x="155" y="385" text-anchor="middle" fill="#062038" font-size="20" font-weight="700">1</text>
    <text x="193" y="382" fill="#f8fbff" font-size="25" font-weight="700">Authorized record</text>
    <text x="145" y="432" fill="#b8d2e7" font-size="19">Synthetic or pre-redacted</text>
    <text x="145" y="464" fill="#b8d2e7" font-size="19">with documented authority</text>
    <text x="145" y="527" fill="#8ee8df" font-size="18" font-weight="700">MINIMIZE DATA</text>

    <circle cx="450" cy="377" r="23" fill="#2ad5c8"/>
    <text x="450" y="385" text-anchor="middle" fill="#062038" font-size="20" font-weight="700">2</text>
    <text x="488" y="382" fill="#f8fbff" font-size="25" font-weight="700">Offline validation</text>
    <text x="440" y="432" fill="#b8d2e7" font-size="19">Reject restricted fields</text>
    <text x="440" y="464" fill="#b8d2e7" font-size="19">and actuation pathways</text>
    <text x="440" y="527" fill="#8ee8df" font-size="18" font-weight="700">ZERO LIVE I/O</text>

    <circle cx="745" cy="377" r="23" fill="#2ad5c8"/>
    <text x="745" y="385" text-anchor="middle" fill="#062038" font-size="20" font-weight="700">3</text>
    <text x="783" y="382" fill="#f8fbff" font-size="25" font-weight="700">Evidence card</text>
    <text x="735" y="432" fill="#b8d2e7" font-size="19">Provenance, uncertainty,</text>
    <text x="735" y="464" fill="#b8d2e7" font-size="19">reviewer, and retention</text>
    <text x="735" y="527" fill="#8ee8df" font-size="18" font-weight="700">AUDIT-READY</text>

    <circle cx="1040" cy="377" r="23" fill="#2ad5c8"/>
    <text x="1040" y="385" text-anchor="middle" fill="#062038" font-size="20" font-weight="700">4</text>
    <text x="1078" y="382" fill="#f8fbff" font-size="25" font-weight="700">Human decision</text>
    <text x="1030" y="432" fill="#b8d2e7" font-size="19">Technical, safety, privacy,</text>
    <text x="1030" y="464" fill="#b8d2e7" font-size="19">and release review</text>
    <text x="1030" y="527" fill="#8ee8df" font-size="18" font-weight="700">ACCOUNTABLE</text>
  </g>

  <rect x="110" y="650" width="1220" height="92" rx="18" fill="#071d31" stroke="#2b6a88" stroke-width="1.5"/>
  <text x="152" y="693" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Public-sector evaluation baseline:</text>
  <text x="152" y="722" fill="#b8d2e7" font-family="Arial, Helvetica, sans-serif" font-size="19">privacy by design  •  evidence provenance  •  cybersecurity gates</text>
  <text x="152" y="748" fill="#b8d2e7" font-family="Arial, Helvetica, sans-serif" font-size="19">human accountability  •  zero-actuation safety boundary  •  no live monitoring or automated action</text>
</svg>
